# port 80 to redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name codeplatoondemo.link www.codeplatoondemo.link;
    
    return 301 https://codeplatoondemo.link$request_uri;
}

# Port 443 is the real server!!! server HTTPS

server {
    listen 443 ssl; #ip4
    listen [::]:443 ssl; #ip6
    server_name codeplatoondemo.link www.codeplatoondemo.link;

    ssl_certificate     /etc/letsencrypt/live/codeplatoondemo.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeplatoondemo.link/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    index index.html;

    location /api/{
        proxy_pass http://backend:8000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

    }


}